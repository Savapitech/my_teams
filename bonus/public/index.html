<!DOCTYPE scale>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTeams Web Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen">
        <div class="login-container">
            <h1>MyTeams : Web Client</h1>
            <p>Front Bonus for the My Teams Epitech Project</p>
            <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
            <button id="loginBtn">Login</button>
        </div>
    </div>

    <div id="appScreen">
        <div class="container">
            <header>
                <h1>MyTeams : Web Client</h1>
                <div class="row">
                  
                <p>Front Bonus for the My Teams Epitech Project</p>
                <button id="logoutBtn">Logout</button>
                </row>
            </header>

            <div class = "row">
                <div class="sidemenu">
                  <div class="create-bar">
                    <button id="create-team-btn">+ Team</button>
                    <button id="create-channel-btn" disabled>+ Channel</button>
                    <button id="create-thread-btn" disabled>+ Thread</button>
                  </div>
                  <div class="create-form" id="create-form" style="display:none">
                    <input type="text" id="create-name" placeholder="Name" autocomplete="off">
                    <input type="text" id="create-desc" placeholder="Description (optional)" autocomplete="off">
                    <div class="create-form-row">
                      <button id="create-confirm-btn">Create</button>
                      <button id="create-cancel-btn">Cancel</button>
                    </div>
                  </div>
                </div>

                <div id="threadList">
                  <div id="thread-header">Select a channel</div>
                  <div id="thread-container"></div>
                </div>
                <div class = "main">
                    <div id="log" class="log-container"></div>

                    <div class="input-container">
                        <input type="text" id="cmdInput" placeholder="Type a message" autocomplete="off">
                        <button id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
